<!DOCTYPE html>
<html lang="es">
<head>
    <title>Document</title>
    <link rel="stylesheet" href="comentarios.css">
    <link rel="icon" href="/Curso HTML/imagenes/pegar.png">
</head>
<body>
    
    <div class="_box_1">
        <h1 class="_tittle">Formulario De Contacto</h1>
        <form class="_form">
            <label for="nom_c">Nombre Completo</label>
            <div>
                <input class="_input_inf" type="Text" placeholder="Nombre Completo" required id="nom_c">
            </div>
            <label for="em">Email</label>
            <div>
                <input class="_input_inf" type="email" placeholder="ejemplo@ejemplo.com" required id="em">
            </div>
            <label for="Telefono">Telefono</label>
            <div>
                <input class="_input_inf" type="text" placeholder="1234567890" required id="Telefono">
            </div>
            <label for="men">Mensaje (Opcional)</label>
            <div>
                <textarea row="6" placeholder="Deje su comentario" id="men"></textarea>
            </div>
            <label for="check">Aceptas las Condiciones?</label><input type="checkbox" name="checkbox" id="check">
            <div>
                <input class="_input_inf" class="_input_inf_sub" type="submit" placeholder="Enviar" name="enviar_inf" value="Enviar" required>
            </div>
            
        </form>
    </div>
</body>
</html>
