<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexbox Wrap Y Flow</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h2 class="flex-item__text">Caja con Row y Wrap (Achique el navegador de forma horizontal) </h2>
    <div class="flexbox">
        
        <div class="flex-item">Caja 1</div>
        <div class="flex-item">Caja 2</div>
        <div class="flex-item">Caja 3</div>
        <div class="flex-item">Caja 4</div>
    </div>
    <h2 class="flex-item__text">Caja con Column y Wrap (Achique el navegador de forma vertical) </h2>
    <div class="flexbox item--box_column">
        
        <div class="flex-item">Caja 1</div>
        <div class="flex-item">Caja 2</div>
        <div class="flex-item">Caja 3</div>
        <div class="flex-item">Caja 4</div>
    </div>
</body>
</html>
